# Skilled Migrant Category Resident Visa (SR3). Worked example 3 in schema v1.
# From 24/08/2026 SMC has three pathways. The rules in force before that date are kept
# as earlier criterion versions so applications lodged before the change get the old test.
stewardship:
  prepared_by: build-team
  approved_by: null
  approved_on: null

evidence_types:
  - id: EV-ENGLISH-TEST
    name: English test result (IELTS, TOEFL iBT, PTE Academic, B2 First or OET) sat at a test centre
  - id: EV-EMPLOYMENT-AGREEMENT
    name: Employment agreement or offer, and job description
  - id: EV-PAY-EVIDENCE
    name: Payslips or bank statements showing salary payments
  - id: EV-QUALIFICATION
    name: Qualification and NZQA International Qualification Assessment where needed

groups:
  - id: SMC-ROOT
    title: Skilled Migrant Category requirements
    operator: ALL
    ref: SR3.10
    members: [SMC-AGE, SMC-ENGLISH, SMC-EMPLOYMENT, SMC-PATHWAY, SMC-RED-LIST, SMC-POINTS-PRE-2026-08]
  - id: SMC-PATHWAY
    title: One of the three SMC pathways (from 24/08/2026)
    operator: ANY
    # The group exists only while the cited version (or a later one) is in force.
    introduced_by: {ref: SR3.10, quote: "Points-based pathway (column A); or Skilled Work Experience pathway (Column B); or Trades and Technician pathway (Column C)."}
    members: [SMC-PATH-A, SMC-PATH-B, SMC-PATH-C]
  - id: SMC-PATH-A
    title: Points-based pathway (column A)
    operator: ALL
    ref: SR3.25
    members: [SMC-A-PAY, SMC-A-POINTS]
  - id: SMC-PATH-B
    title: Skilled Work Experience pathway (column B)
    operator: ALL
    ref: SR3.35
    members: [SMC-B-PAY, SMC-B-EXPERIENCE, SMC-B-NZ-EXPERIENCE]
  - id: SMC-PATH-C
    title: Trades and Technician pathway (column C)
    operator: ALL
    ref: SR3.40
    members: [SMC-C-LIST, SMC-C-QUALIFICATION, SMC-C-EXPERIENCE, SMC-C-NZ-EXPERIENCE]

criteria:
  - id: SMC-AGE
    title: Aged 55 or younger when the application is made
    kind: objective
    versions:
      - ref: SR3.10
        quote: "be aged 55 or younger at the time the residence application is made"
      - ref: SR3.10
        as_at: 2026-08-01
        quote: "be aged 55 or younger at the time the residence application is made"
    condition: "age_at_lodgement <= 55"

  - id: SMC-ENGLISH
    title: Minimum standard of English (test at a test centre, no more than two years old)
    kind: objective
    versions:
      - ref: SR2.10
        quote: "obtained by sitting the test in person at a test centre (tests taken remotely outside of a test centre, including 'at home' tests, are not acceptable) that, at the time the application is lodged are: no more than two years old"
      - ref: SR2.10
        as_at: 2026-08-01
        quote: "acceptable English language test results no more than two years old at the time the application is lodged, as set out at SR2.10.5, obtained by sitting the test in person at a test centre"
    evidence: [EV-ENGLISH-TEST, EV-QUALIFICATION]

  - id: SMC-EMPLOYMENT
    title: Skilled employment (full-time, accredited employer, permanent or 12 months, genuine)
    kind: evidential
    versions:
      - ref: SR3.15
        quote: "full-time (employment is full-time if it amounts to at least 30 guaranteed hours per week for every week worked); and with an employer who is accredited (and their accreditation is not suspended) at the time the residence application is either made or decided; and permanent or for a fixed term of at least 12 months; and genuine and not offered as the result of payment (see SR2.1.5)"
      - ref: SR3.20
        as_at: 2026-08-01
        quote: "the median wage (currently $35.00 per hour) if their occupation is listed at ANZSCO skill level 1-3; or 1.5 times the median wage (currently $52.50 per hour) if their occupation listed at ANZSCO skill level 4-5, or not included in the ANZSCO"
    evidence: [EV-EMPLOYMENT-AGREEMENT, EV-PAY-EVIDENCE]

  - id: SMC-POINTS-PRE-2026-08
    title: 6 points from one skill category, or one skill category plus NZ skilled work experience (before 24/08/2026)
    kind: objective
    ref: SR3.10
    as_at: 2026-08-01
    quote: "qualify for the 6 points, from: one skill category (income, qualification, or New Zealand registration, see SR3.25); or a combination of one skill category and their skilled work experience in New Zealand (see SR3.35)"
    condition: "skill_points + nz_experience_points >= 6"

  - id: SMC-A-PAY
    title: Points-based, paid the SMC wage threshold (ANZSCO 1-3) or 1.5 times (ANZSCO 4-5)
    kind: objective
    ref: SR3.25
    quote: "the SMC wage threshold (see SR3.10.5) if their occupation is listed at ANZSCO skill level 1-3; or 1.5 times the SMC wage threshold (see SR3.10.5) if their occupation is listed at ANZSCO skill level 4-5 or not included in ANZSCO"
    condition: "hourly_pay >= wage_threshold(date_rule SR3.10(f)) * (1.0 if anzsco_level <= 3 else 1.5)"
    uses_list: [SMC_WAGE_THRESHOLD]
    evidence: [EV-EMPLOYMENT-AGREEMENT, EV-PAY-EVIDENCE]

  - id: SMC-A-POINTS
    title: Points-based, 6 points from one skill category or with NZ skilled work experience
    kind: objective
    ref: SR3.10
    quote: "6 points must be obtained from a skill category, or a combination of one skill category and skilled work experience in New Zealand."
    condition: "SUM(skill_points[income|qualification|registration], nz_experience_points[1..3]) >= 6"

  - id: SMC-B-PAY
    title: Skilled Work Experience, paid 1.1 times the threshold (1.2 times for Amber List)
    kind: objective
    ref: SR3.10
    quote: "paid 1.1 times the SMC wage threshold; or paid 1.2 times the SMC wage threshold for occupations on the Amber List."
    condition: "hourly_pay >= wage_threshold * (1.2 if amber_list else 1.1)"
    uses_list: [SMC_WAGE_THRESHOLD]
    evidence: [EV-EMPLOYMENT-AGREEMENT, EV-PAY-EVIDENCE]

  - id: SMC-B-EXPERIENCE
    title: Skilled Work Experience, 3 years of directly relevant work experience
    kind: evidential
    ref: SR3.10
    quote: "3 years of directly relevant work experience (SR3.35.5.1) in an ANZSCO 1-3 role"
    evidence: [EV-EMPLOYMENT-AGREEMENT]

  - id: SMC-B-NZ-EXPERIENCE
    title: Skilled Work Experience, 2 more years in New Zealand (5 years in total)
    kind: evidential
    ref: SR3.10
    quote: "Principal applicants must have 2 years of additional directly relevant skilled work experience in New Zealand (SR3.35.5.5)"
    evidence: [EV-EMPLOYMENT-AGREEMENT, EV-PAY-EVIDENCE]

  - id: SMC-C-LIST
    title: Trades and Technician, occupation on the Trades and Technician list (Appendix 23)
    kind: objective
    ref: SR3.10
    quote: "in an occupation listed in the Trades and Technician occupation List (Appendix 23)"

  - id: SMC-C-QUALIFICATION
    title: Trades and Technician, level 4 or higher qualification relevant to the occupation
    kind: evidential
    ref: SR3.10
    quote: "a level 4 (or higher) qualification (SR3.40.5) relevant to the skilled employment occupation"
    evidence: [EV-QUALIFICATION]

  - id: SMC-C-EXPERIENCE
    title: Trades and Technician, 2 years 6 months of work experience after the qualification
    kind: evidential
    ref: SR3.10
    quote: "2 years and 6 months of directly relevant work experience (SR3.40.10.1), in an ANZSCO 1-3 role, completed post qualification."
    evidence: [EV-EMPLOYMENT-AGREEMENT]

  - id: SMC-C-NZ-EXPERIENCE
    title: Trades and Technician, 18 months more in New Zealand (4 years in total)
    kind: evidential
    ref: SR3.10
    quote: "Principal applicants must have 18 months of additional directly relevant skilled work experience in New Zealand (SR3.40.10.5)"
    evidence: [EV-EMPLOYMENT-AGREEMENT, EV-PAY-EVIDENCE]

  - id: SMC-RED-LIST
    title: Red List occupations may only use the Points-based pathway (from 24/08/2026)
    kind: objective
    ref: SR3.10
    quote: "Principal applicants with skilled employment in an occupation listed in Appendix 22 (the Red List) may only apply via the Points-based pathway."

reference_lists:
  - id: SMC_WAGE_THRESHOLD
    name: SMC wage threshold in effect across time (hourly, NZD)
    ref: SR3.10
    note: >-
      Which date's threshold applies is set by SR3.10(f): when the applicant began to accrue
      the NZ skilled work experience that counts, or when invited to apply if none is needed.
    columns: ["1.0", "1.1", "1.2", "1.5", "2.0", "3.0"]
    rows:
      - {from: 2020-02-24, to: 2021-07-19, values: [25.50, 28.05, 30.60, 38.25, 51.00, 76.50], quote: "24 February 2020 – 18 July 2021 $25.50 $28.05 $30.60 $38.25 $51.00 $76.50"}
      - {from: 2021-07-19, to: 2022-10-24, values: [27.00, 29.70, 32.40, 40.50, 54.00, 81.00], quote: "19 July 2021 – 23 October 2022 $27.00 $29.70 $32.40 $40.50 $54.00 $81"}
      - {from: 2022-10-24, to: 2023-02-27, values: [27.76, 30.53, 33.31, 41.64, 55.52, 83.28], quote: "24 October 2022 – 26 February 2023 $27.76 $30.53 $33.31 $41.64 $55.52 $83.28"}
      - {from: 2023-02-27, to: 2024-02-28, values: [29.66, 32.62, 35.59, 44.49, 59.32, 88.98], quote: "27 February 2023 – 27 February 2024 $29.66 $32.62 $35.59 $44.49 $59.32 $88.98"}
      - {from: 2024-02-28, to: 2025-08-18, values: [31.61, 34.77, 37.93, 47.41, 63.22, 94.83], quote: "28 February 2024 – 17 August 2025 $31.61 $34.77 $37.93 $47.41 $63.22 $94.83"}
      - {from: 2025-08-18, to: 2026-03-09, values: [33.56, 36.91, 40.27, 50.34, 67.12, 100.68], quote: "18 August 2025 – 8 March 2026 $33.56 $36.91 $40.27 $50.34 $67.12 $100.68"}
      - {from: 2026-03-09, to: null, values: [35.00, 38.50, 42.00, 52.50, 70.00, 105.00], quote: "9 March 2026 onwards $35.00 $38.50 $42.00 $52.50 $70 $105.00"}
