services:
  neo4j:
    image: neo4j:5.26-community
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-localdevpassword}
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p $${NEO4J_PASSWORD:-localdevpassword} 'RETURN 1' || exit 1"]
      interval: 10s
      retries: 12

volumes:
  neo4j-data:
