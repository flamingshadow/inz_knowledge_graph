[project]
name = "inzkg"
version = "0.1.0"
description = "Immigration New Zealand rules knowledge graph (Neo4j) and staff query assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "neo4j>=5.20",
  "anthropic>=2.12",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
inzkg = "inzkg.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["inzkg*"]

[tool.setuptools.package-data]
inzkg = ["schema.cypher", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["neo4j: needs a running Neo4j loaded with the rulebook (skipped if unreachable)"]
